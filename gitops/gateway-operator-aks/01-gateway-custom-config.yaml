# Helm values override for the Gateway Operator's internal "gateway" chart
# (gateway-1.1.0 on this cluster -- gateway-operator 0.8.0/image 0.8.1),
# referenced by 00-apigateway.yaml via spec.configRef.
#
# gatewayRuntime.deployment.replicaCount: 2 + nodeSelector + podAntiAffinity
# give active-active router HA confined to the gatewaypool node pool:
# the gatewayRuntime Service is already type: LoadBalancer, so Kubernetes
# distributes traffic across both replicas automatically (this replaces
# the manual external-LB setup used on the VM deployment). nodeSelector
# keeps these pods off systempool (reserved for cluster components like
# CoreDNS/ArgoCD) -- confirmed via `kubectl get nodes -L agentpool` that
# AKS labels its pools agentpool: gatewaypool / systempool. Anti-affinity
# then spreads the 2 replicas across gatewaypool's 2 nodes for real
# node-level redundancy, matching what an external LB across 2 VMs did.
#
# controller.deployment.replicaCount is intentionally left at the chart
# default (1) -- confirmed no leader-election exists in this chart, and
# storage is still SQLite (single-writer, can't span replicas on
# different nodes). Revisit once the Postgres storage migration lands;
# see README.md for that plan.
apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-gateway-values
  namespace: default
data:
  values.yaml: |
    gateway:
      controller:
        encryptionKeys:
          enabled: true
          secretName: gateway-encryption-keys
      gatewayRuntime:
        deployment:
          replicaCount: 2
          nodeSelector:
            agentpool: gatewaypool
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/component: gateway-runtime
                    topologyKey: kubernetes.io/hostname
