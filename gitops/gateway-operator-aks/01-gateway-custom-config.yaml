# Helm values override for the Gateway Operator's internal "gateway" chart
# (gateway-1.2.3 on this cluster, upgraded from 1.1.0 -- gateway-operator
# 0.8.0/image 0.8.1 itself is unchanged, only its gateway.helm.chartVersion
# value was bumped), referenced by 00-apigateway.yaml via spec.configRef.
#
# POSTGRES: set directly here via gateway.config.controller.storage.*
# rather than through the CRD's spec.storage field. spec.storage IS a
# real, typed APIGateway field (confirmed via `kubectl explain
# apigateway.spec.storage --recursive`) and DOES trigger a real
# reconcile/Helm upgrade -- but empirically verified (via helm get
# values, on BOTH chart 1.1.0 and 1.2.3) that the Operator's CR-to-values
# translation never actually populates the chart's storage fields from
# it; the release silently stays on sqlite regardless. This is a
# distinct Operator gap from the fsGroup stringification bug -- there
# the field gets corrupted; here it's just dropped. Also separately
# confirmed chart 1.1.0 has NO real Postgres implementation at all (its
# values.yaml marks it "(future support)", with only a sqlite: sub-block
# defined) -- 1.2.3 is the first version that actually implements it.
# Full field path confirmed via chart source inspection:
#   gateway.config.controller.storage.{type, postgres.*}  -- connection
#   gateway.controller.postgres.passwordSecretRef.{name,key} -- password
#     (kept OUT of this ConfigMap deliberately -- injected from the
#     gateway-db-connection Secret's "password" key, created out-of-band)
# Once this took effect, the controller's PVC stopped being created --
# templates/gateway/controller/pvc.yaml is conditional on
# storage.type == "sqlite" -- so the earlier fsGroup patch is no longer
# needed for the controller (confirmed obsolete, not just assumed).
apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-gateway-values      # must match spec.configRef.name in 00-apigateway.yaml exactly
  namespace: default
data:
  values.yaml: |                   # the ONLY key the Operator reads -- this whole blob is the chart's values.yaml
    gateway:
      controller:
        encryptionKeys:
          enabled: true                            # mounts the AES-256 key secret below into the controller
          secretName: gateway-encryption-keys       # pre-existing secret, created out-of-band (not in git)
        postgres:
          passwordSecretRef:
            name: gateway-db-connection
            key: password
        deployment:
          # Postgres is specifically what "enables multi-replica controller
          # deployments" per this chart's own values.yaml comment -- no leader
          # election exists or is needed; the schema's gateway_states/events
          # tables ARE the multi-replica sync mechanism (confirmed via
          # gateway-controller-db.postgres.sql: "used by eventhub for
          # multi-replica sync"). Was blocked entirely while storage was
          # SQLite (single-writer file, can't span replicas/nodes).
          replicaCount: 2
          nodeSelector:
            agentpool: gatewaypool
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/component: controller
                    topologyKey: kubernetes.io/hostname
        tls:
          certManager:
            # commonName/dnsNames must match the hostname clients actually connect with,
            # or TLS hostname verification fails. Was "localhost" (chart default) -- clients
            # could only reach it by IP with curl -k, since no cert covered a real hostname.
            commonName: wk-onboarding-gw.eastus.cloudapp.azure.com
            dnsNames:
              - wk-onboarding-gw.eastus.cloudapp.azure.com
      config:
        controller:
          storage:
            type: postgres
            postgres:
              host: wk-onboarding-pg.postgres.database.azure.com
              port: 5432
              database: gateway_controller
              user: gateway
              sslmode: require
        router:
          # Envoy's virtual-host matcher. "*" (chart default) matches any Host header --
          # fine for a demo, but setting the real hostname here is what actually makes
          # the gateway a proper named endpoint rather than "whatever IP happens to answer".
          gateway_host: wk-onboarding-gw.eastus.cloudapp.azure.com
      gatewayRuntime:
        deployment:
          replicaCount: 2                    # active-active: 2 router pods instead of the chart default of 1
          # Explicit httpGet-only probes -- required after the 1.1.0 -> 1.2.3
          # chart bump. The gateway-operator's own bundled base values
          # (/config/gateway_values.yaml, written for chart 1.1.0) still set
          # livenessProbe.exec/readinessProbe.exec (health-check.sh), but
          # chart 1.2.3's own default switched to httpGet. Helm deep-merges
          # values rather than replacing them, so without this override the
          # merged probe ends up with BOTH exec and httpGet set, which the
          # Kubernetes API rejects: "may not specify more than 1 handler
          # type". Hit this as a real (currently stale/non-blocking, but
          # latent) Programmed=False condition on the APIGateway CR. These
          # values match chart 1.2.3's own httpGet defaults, PLUS an
          # explicit `exec: null` -- Helm's map merge adds/overrides keys,
          # it does NOT remove sibling keys by omission, so just adding
          # httpGet here would still leave the operator's exec key sitting
          # alongside it (same collision, different source). `exec: null`
          # is what actually forces that key out of the merged result.
          livenessProbe:
            exec: null
            httpGet:
              path: /_gateway-health/healthy
              port: https
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec: null
            httpGet:
              path: /_gateway-health/ready
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          nodeSelector:
            agentpool: gatewaypool           # confines both pods to the gatewaypool node pool, off systempool
          affinity:
            podAntiAffinity:
              # "preferred" (soft) rule: spreads the 2 replicas across gatewaypool's 2
              # different nodes when possible, without blocking scheduling if it can't.
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/component: gateway-runtime
                    topologyKey: kubernetes.io/hostname
        service:
          annotations:
            # Azure's free DNS-label feature: makes AKS's cloud-controller-manager register
            # this label against the LoadBalancer's public IP, giving a stable hostname
            # (wk-onboarding-gw.eastus.cloudapp.azure.com) instead of a bare IP that would
            # change if the Service/LB were ever recreated.
            service.beta.kubernetes.io/azure-dns-label-name: wk-onboarding-gw
