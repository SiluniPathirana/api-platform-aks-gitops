# Helm values override for the Gateway Operator's internal "gateway" chart
# (gateway-1.1.0 on this cluster -- gateway-operator 0.8.0/image 0.8.1),
# referenced by 00-apigateway.yaml via spec.configRef.
#
# gatewayRuntime.deployment.replicaCount: 2 + podAntiAffinity below gives
# active-active router HA -- the gatewayRuntime Service is already
# type: LoadBalancer, so Kubernetes distributes traffic across both
# replicas automatically (this replaces the manual external-LB setup used
# on the VM deployment). Anti-affinity spreads the 2 replicas across the
# 2 nodes in gatewaypool for real node-level redundancy.
#
# controller.deployment.replicaCount is intentionally left at the chart
# default (1) -- confirmed no leader-election exists in this chart, and
# storage is still SQLite (single-writer, can't span replicas on
# different nodes). Revisit once the Postgres storage migration lands;
# see README.md for that plan.
gateway:
  controller:
    encryptionKeys:
      enabled: true
      secretName: gateway-encryption-keys
  gatewayRuntime:
    deployment:
      replicaCount: 2
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: gateway-runtime
                topologyKey: kubernetes.io/hostname
