# APIGateway CR for the real Azure AKS cluster (wk-onboarding-aks), Bottom-Up
# (Operator/CRD) mode -- same pattern as gitops/gateway-operator/ (local
# Rancher Desktop validation), now on actual cloud infrastructure.
#
# Storage is Postgres -- but configured via 01-gateway-custom-config.yaml
# (gateway.config.controller.storage.*), NOT via spec.storage below.
# spec.storage IS a real, typed APIGateway field (confirmed via `kubectl
# explain apigateway.spec.storage --recursive`) and DOES trigger a real
# reconcile/Helm upgrade when set -- but empirically confirmed (via
# `helm get values`, on both chart 1.1.0 and 1.2.3) that the Operator
# never actually translates it into the chart's storage values; the
# release silently stayed on sqlite regardless. Deliberately left unset
# here rather than included-but-nonfunctional. See README.md for the
# full story and the confirmed-working ConfigMap-based workaround.
#
# Server: wk-onboarding-pg.postgres.database.azure.com (Azure Postgres
# Flexible Server, eastus2 -- eastus itself was blocked by an Azure
# Policy location restriction on this resource type; eastus2 was not).
# Database gateway_controller, app-level role "gateway" (least-privilege,
# distinct from the gwadmin server superuser).
#
# NOTE: the Operator only reconciles the internal Helm release when this
# CR's own spec changes (bumping its generation) -- it does NOT watch the
# referenced configRef ConfigMap for content changes on its own. So any
# time 01-gateway-custom-config.yaml changes, spec.infrastructure.labels
# here needs a trivial bump (e.g. configRevision) to force a reconcile.
apiVersion: gateway.api-platform.wso2.com/v1alpha1
kind: APIGateway
metadata:
  name: cluster-gw
  namespace: default
spec:
  apiSelector:
    scope: Cluster
  configRef:
    name: custom-gateway-values
  infrastructure:
    labels:
      environment: dev
      team: platform
      configRevision: "8"
