# APIGateway CR for the real Azure AKS cluster (wk-onboarding-aks), Bottom-Up
# (Operator/CRD) mode -- same pattern as gitops/gateway-operator/ (local
# Rancher Desktop validation), now on actual cloud infrastructure.
#
# Storage is still SQLite at this point -- Postgres migration is pending an
# Azure Policy permission request (see README.md in this folder). Once
# granted, spec.storage will be added here directly (it's a first-class,
# properly-typed APIGateway field -- confirmed via `kubectl explain
# apigateway.spec --recursive` -- unlike podSecurityContext, which only
# exists via the buggy configRef/ConfigMap merge path. See README for why
# that distinction matters.)
#
# NOTE: the Operator only reconciles the internal Helm release when this
# CR's own spec changes (bumping its generation) -- it does NOT watch the
# referenced configRef ConfigMap for content changes on its own. So any
# time 01-gateway-custom-config.yaml changes, spec.infrastructure.labels
# here needs a trivial bump (e.g. configRevision) to force a reconcile.
apiVersion: gateway.api-platform.wso2.com/v1alpha1
kind: APIGateway
metadata:
  name: cluster-gw
  namespace: default
spec:
  apiSelector:
    scope: Cluster
  configRef:
    name: custom-gateway-values
  infrastructure:
    labels:
      environment: dev
      team: platform
      configRevision: "3"
